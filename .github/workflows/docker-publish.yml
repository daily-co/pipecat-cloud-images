name: Docker Build and Push

# A push to main publishes only when it carries a version not yet released,
# which the git tag v<version> records: other merges build and check the image
# but push nothing, so changes can land over several pull requests and ship
# together in a release (pipecat-base/README.md). The paths are what goes into
# the image; nothing else needs a build.
on:
  push:
    branches: ['main']
    paths: &image-paths
      - 'pipecat-base/**'
      - '!pipecat-base/tests/**'
      - '!pipecat-base/README.md'
      - '!pipecat-base/CHANGELOG.md'
      - 'versions.yaml'
      - '.github/workflows/docker-publish.yml'
  pull_request:
    branches: ['main']
    paths: *image-paths

permissions:
  contents: read

# Pushes to main run one at a time, so two merges cannot both find a version
# unreleased and publish it from different commits. Pull requests supersede
# their own earlier runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  find-images:
    runs-on: ubuntu-latest
    outputs:
      base-version: ${{ steps.get-versions.outputs.base-version }}
      python-versions: ${{ steps.get-versions.outputs.python-versions }}
      default-python: ${{ steps.get-versions.outputs.default-python }}
      base-images: ${{ steps.get-versions.outputs.base-images }}
      publish: ${{ steps.release.outputs.publish }}
    steps:
      - uses: actions/checkout@v4

      - id: get-versions
        run: |
          BASE_VERSION=$(yq '.project.version' pipecat-base/pyproject.toml)
          PYTHON_VERSIONS=$(yq '.base.python_versions | @json' versions.yaml)
          DEFAULT_PYTHON=$(yq '.base.default_python' versions.yaml)
          BASE_IMAGES=$(yq -o=json -I=0 '.base.base_images' versions.yaml)

          if ! [[ $BASE_VERSION =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid base version format in pipecat-base/pyproject.toml"
            exit 1
          fi

          # A Python without a pinned base image would fall back to the
          # Dockerfile's floating default, so every one must have its own, and
          # from astral-sh/uv's repository: the refresh keeps whatever
          # repository a pin names.
          for v in $(yq '.base.python_versions[]' versions.yaml); do
            ref=$(v="$v" yq '.base.base_images[strenv(v)] // ""' versions.yaml)
            if ! [[ $ref == "ghcr.io/astral-sh/uv:python$v-"*@sha256:* && $ref =~ @sha256:[0-9a-f]{64}$ ]]; then
              echo "::error file=versions.yaml::base_images needs '$v' as a ghcr.io/astral-sh/uv:python$v- tag pinned by @sha256 digest, found '$ref'"
              exit 1
            fi
          done

          echo "base-version=$BASE_VERSION" >> $GITHUB_OUTPUT
          echo "python-versions=$PYTHON_VERSIONS" >> $GITHUB_OUTPUT
          echo "default-python=$DEFAULT_PYTHON" >> $GITHUB_OUTPUT
          echo "base-images=$BASE_IMAGES" >> $GITHUB_OUTPUT

      # uv sync --locked installs from wherever the lock says, and trusts a
      # hash the lock supplies with it, so a lock that points one wheel at
      # another host still installs. A refresh's lock diff changes dozens of
      # URLs at once, where one changed host is easy to miss. Parsed rather
      # than grepped: TOML can spell the same entry many ways, and uv reads
      # them all. Each file must also be named for its package: anyone can
      # publish to files.pythonhosted.org, and uv installs a wheel without
      # checking its name against the entry, while PyPI accepts a file only
      # under its own project's name.
      - name: Check uv.lock installs only from PyPI
        shell: python
        run: |
          import re
          import sys
          import tomllib
          from urllib.parse import unquote, urlsplit

          REGISTRY = {"registry": "https://pypi.org/simple"}
          FILES = "https://files.pythonhosted.org/"
          # The project itself, which the lock records and the Dockerfile's
          # --no-install-project skips. Only by its own name: uv builds an
          # entry of any other name that shares its source, with whatever
          # build backend pyproject.toml names.
          PROJECT = "pipecat-base"
          PROJECT_SOURCES = [{"editable": "."}, {"virtual": "."}]


          def canonical(name):
              return re.sub(r"[-_.]+", "-", name).lower()


          def project_of(url):
              # The filename as uv reads it: the path's last segment, decoded.
              # A wheel's name never has a "-", and a normalized sdist's
              # version never does.
              filename = unquote(urlsplit(url).path.rpartition("/")[2])
              if filename.endswith(".whl"):
                  return filename.partition("-")[0]
              return filename.rpartition("-")[0]


          with open("pipecat-base/uv.lock", "rb") as f:
              lock = tomllib.load(f)
          outside = []
          for package in lock["package"]:
              name, source = package["name"], package.get("source")
              files = [package["sdist"]] if "sdist" in package else []
              files += package.get("wheels", [])
              if name == PROJECT and source in PROJECT_SOURCES and not files:
                  continue
              if source != REGISTRY:
                  outside.append(f"{name} from {source}")
              outside += [
                  f"{name} from {f.get('url') or f.get('path') or f}"
                  for f in files
                  if not f.get("url", "").startswith(FILES)
                  or canonical(project_of(f["url"])) != canonical(name)
              ]
          if outside:
              print(
                  "::error file=pipecat-base/uv.lock::uv.lock installs from outside each "
                  f"package's own PyPI project: {outside[0]}"
              )
              sys.exit(1)

      - id: release
        env:
          VERSION: ${{ steps.get-versions.outputs.base-version }}
        # ls-remote exits 2 when the tag does not exist; any other failure
        # stops the run rather than be taken as unreleased and republish.
        #
        # A pull request never publishes, but one that changes what an already
        # released version's changelog section says would merge green and ship
        # nothing: a release pull request opened before another release of the
        # same version merged, once its CHANGELOG.md conflict is resolved.
        run: |
          status=0
          git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" > /dev/null || status=$?
          if [[ $status != 0 && $status != 2 ]]; then
            echo "::error::Could not check for the tag v$VERSION (git ls-remote exited $status)."
            exit 1
          fi
          if [[ "$GITHUB_EVENT_NAME" == pull_request && $status == 0 ]]; then
            git fetch --quiet --depth=1 origin tag "v$VERSION"
            section() { awk -v h="## [$VERSION]" 'index($0, h) == 1 { on = 1 } on && /^## \[/ && index($0, h) != 1 { exit } on'; }
            if ! diff <(git show "v$VERSION:pipecat-base/CHANGELOG.md" | section) <(section < pipecat-base/CHANGELOG.md); then
              echo "::error file=pipecat-base/CHANGELOG.md::This changes the changelog for v$VERSION, which is already released, so merging it would publish nothing. Move the changes under [Unreleased], or release them as a new version: for a weekly refresh, run it again."
              exit 1
            fi
          fi
          if [[ "$GITHUB_EVENT_NAME" != push || "$GITHUB_REF" != refs/heads/main ]]; then
            echo "publish=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          case $status in
            0)
              echo "::notice::v$VERSION is already released: building and checking only. Bump the version in pipecat-base/pyproject.toml to publish."
              echo "publish=false" >> $GITHUB_OUTPUT
              ;;
            2)
              echo "::notice::Publishing v$VERSION."
              echo "publish=true" >> $GITHUB_OUTPUT
              ;;
          esac

  container-signal-checks:
    runs-on: ubuntu-latest
    name: Container Signal Checks
    needs: find-images
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          # The engine's own builder, which reads and writes the local image
          # store: the agent-image step below builds FROM the image this job
          # builds first. The action's default, a docker-container builder,
          # would look for that image in a registry.
          driver: docker

      - name: Build (runner arch, loaded locally)
        uses: docker/build-push-action@v5
        with:
          context: ./pipecat-base
          # Single-platform and loaded: the checks run the image, and a
          # multi-platform build cannot be loaded into the local daemon. The
          # PID 1 behaviour under test is independent of the architecture and
          # of the Python minor, so the runner's arch and the default Python
          # are enough; build-base still covers the full matrix.
          load: true
          tags: pipecat-base:signal-check
          build-args: |
            VERSION=signal-check
            PYTHON_VERSION=${{ needs.find-images.outputs.default-python }}
            BASE_IMAGE=${{ fromJson(needs.find-images.outputs.base-images)[needs.find-images.outputs.default-python] }}

      - name: Build an agent image on it
        # app.py refuses to start without pipecat-ai, which the base image
        # leaves to the agent image; add it the way the README tells an agent
        # image to. Pinned so the gate does not move with pipecat-ai releases;
        # test.yml covers pipecat-ai compatibility. pipecat-ai 1.x needs Python
        # 3.11 or newer, which default_python in versions.yaml is.
        run: |
          docker build -t pipecat-base:signal-check-agent - <<'EOF'
          FROM pipecat-base:signal-check
          RUN pip install --no-cache-dir pipecat-ai==1.12.0
          EOF

      - name: Run container signal checks
        working-directory: pipecat-base
        # Asserts Python is not PID 1, that a SIGTERM during startup terminates
        # the container both under tini and with tini bypassed, and that a
        # graceful shutdown still reports exit 0. Stdlib only.
        run: python3 container_signal_check.py pipecat-base:signal-check-agent

  build-base:
    runs-on: ubuntu-24.04-arm
    name: Build Base Images
    # Every customer bot is built FROM this image: do not publish one that
    # fails its signal checks. Runs on push as well as pull_request so the
    # gate holds for the build that actually pushes.
    needs: [find-images, container-signal-checks]
    strategy:
      matrix:
        python-version: ${{ fromJson(needs.find-images.outputs.python-versions) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        if: needs.find-images.outputs.publish == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PAT }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: dailyco/pipecat-base
          tags: |
            type=raw,value=latest-py${{ matrix.python-version }}
            type=raw,value=${{ needs.find-images.outputs.base-version }}-py${{ matrix.python-version }}
            type=raw,value=latest,enable=${{ matrix.python-version == needs.find-images.outputs.default-python }}
            type=raw,value=${{ needs.find-images.outputs.base-version }},enable=${{ matrix.python-version == needs.find-images.outputs.default-python }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        id: build
        uses: docker/build-push-action@v5
        with:
          context: ./pipecat-base
          # Every customer bot is built FROM this image, so an arm64-only base
          # means an amd64 customer cannot produce a runnable bot at all. This
          # runner is arm64, so arm64 is the native leg and amd64 is emulated;
          # buildx builds them together. Emulation is cheap here because nothing
          # is compiled from source — the only emulated work is the apt install,
          # and both platforms build in ~2 minutes.
          platforms: linux/amd64,linux/arm64
          push: ${{ needs.find-images.outputs.publish == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # One SBOM per platform, attached to the index. Scanning the index
          # after the fact would describe only whichever platform resolved.
          sbom: true
          build-args: |
            VERSION=${{ needs.find-images.outputs.base-version }}
            PYTHON_VERSION=${{ matrix.python-version }}
            BASE_IMAGE=${{ fromJson(needs.find-images.outputs.base-images)[matrix.python-version] }}

      - name: Verify the pushed image is multi-arch
        # Regression guard so a single-arch base cannot land again silently.
        # Attestation manifests show up as unknown/unknown and are filtered out.
        if: needs.find-images.outputs.publish == 'true'
        run: |
          ref="dailyco/pipecat-base@${{ steps.build.outputs.digest }}"
          archs=$(docker buildx imagetools inspect --raw "$ref" \
            | jq -r '.manifests[].platform | select(.os != "unknown") | "\(.os)/\(.architecture)"' \
            | sort -u)
          echo "platforms: $(echo "$archs" | tr '\n' ' ')"
          for want in linux/amd64 linux/arm64; do
            echo "$archs" | grep -qx "$want" || { echo "!! missing $want"; exit 1; }
          done

  tag-release:
    name: Tag the Release
    # Only once every Python's image is pushed, so the tag means the release is
    # complete. If a leg fails, there is no tag, and re-running the failed jobs
    # finishes the release.
    needs: [find-images, build-base]
    if: needs.find-images.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Tag the commit v${{ needs.find-images.outputs.base-version }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.find-images.outputs.base-version }}
        run: gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/v$VERSION" -f sha="$GITHUB_SHA"
