[project]
name = "pipecat-base"
version = "0.2.0"
description = "Pipecat Cloud Base Image"
requires-python = ">=3.10"
dependencies = [
    "fastapi[standard]>=0.115.6,<1",
    "loguru~=0.7.3",
    # pipecatcloud 1.x needs Python 3.11 or newer, as does pipecat-ai 1.x; the
    # Python 3.10 image stays on 0.4.4, the last pipecatcloud release for it.
    # pipecatcloud 1.x declares pipecat-ai 1.0.0 for its agent types, but they
    # build on 0.0.78 and newer, which this image supports; the floor legs in
    # .github/workflows/test.yml keep that true when either is upgraded.
    "pipecatcloud>=1.2.0; python_version >= '3.11'",
    "pipecatcloud==0.4.4; python_version < '3.11'",
    "pip>=26.1",
    "nltk>=3.10.0,<4",
]

[dependency-groups]
dev = []

[tool.hatch.build.targets.wheel]
packages = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
