[project]
name = "pipecat-base"
version = "0.2.9"
description = "Pipecat Cloud Base Image"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.115.6,<1",
    "loguru~=0.7.3",
    # pipecatcloud 1.x declares pipecat-ai 1.0.0 for its agent types, but they
    # build on 0.0.78 and newer, which this image supports; the floor legs in
    # .github/workflows/test.yml keep that true when either is upgraded.
    "pipecatcloud>=1.3.0",
    # app.py imports aiohttp itself, so its security floor is held here rather
    # than left to whichever version pipecatcloud happens to bring.
    "aiohttp>=3.14.4,<4",
    # pip and certifi are floored for the eMudhra/emSign CA distrust: earlier
    # releases still trust certificates issued from those CAs' weak keys.
    # certifi comes through httpx, and is what it verifies against; pip vendors
    # its own copy, so only pip's release fixes it.
    "certifi>=2026.10.19",
    "pip>=26.2.2",
    "nltk>=3.10.4,<4",
]

[dependency-groups]
# Not in the image: the Dockerfile syncs with --no-dev. CI and the pre-commit
# hooks take each group on its own; dev gives a local `uv run` both. ruff's
# settings are in the repo root's ruff.toml.
test = ["pytest>=9.0.3,<10"]
lint = ["ruff==0.12.12"]
dev = [{ include-group = "test" }, { include-group = "lint" }]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
