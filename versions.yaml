    - '3.11'
    - '3.12'
    - '3.13'
    - '3.14'
  default_python: '3.12'
  # The upstream image each Python's image is built FROM, pinned by digest so
  # that a build takes the upstream image recorded here and an upstream update
  # arrives as a change to this file. The tag says what the digest was resolved
  # from; with a digest present, Docker pulls by the digest alone. Every
  # version in python_versions needs an entry.
